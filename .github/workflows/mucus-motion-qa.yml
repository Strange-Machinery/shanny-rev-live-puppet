name: Temporary motion-visibility QA
on:
  push:
    branches: [rd/buff-mucus-frame-hud-20261014]
    paths:
      - .github/workflows/mucus-motion-qa.yml
      - src/remote-web/stage.css
      - src/remote-web/stage.html
      - scripts/preview-stank-popup.mjs
permissions:
  contents: read
jobs:
  visual-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare real-time motion pixels and reduced-motion fallback
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --no-audit --fund=false playwright-core@1.56.0
          export CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable)"
          export STANK_PREVIEW_PORT=18783
          node scripts/preview-stank-popup.mjs > /tmp/mucus-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          node --input-type=module <<'JS'
          import {chromium} from 'playwright-core';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH,
            args:['--no-sandbox','--disable-dev-shm-usage']});
          try {
            const page=await browser.newPage({viewport:{width:1920,height:1080},reducedMotion:'no-preference'});
            await page.goto('http://127.0.0.1:18783/donation?backdrop=1&motion=demo');
            const track='.mucus-flow-track--lip-a',strand='.mucus-strand--a';
            const capture=()=>page.evaluate(({track,strand})=>{
              const a=getComputedStyle(document.querySelector(track));
              const b=getComputedStyle(document.querySelector(strand));
              return {dash:a.strokeDashoffset,trackAnimation:a.animationName,
                strandTransform:b.transform,strandAnimation:b.animationName,
                previewText:document.querySelector('.preview-motion-status')?.textContent};
            },{track,strand});
            await page.waitForTimeout(250);
            const start=await capture();
            await page.screenshot({path:'/tmp/mucus-motion-start.png'});
            await page.waitForTimeout(1500);
            const end=await capture();
            await page.screenshot({path:'/tmp/mucus-motion-end.png'});
            console.log('VISIBLE_MOTION_CHECK',JSON.stringify({start,end}));
            if(start.dash===end.dash||start.strandTransform===end.strandTransform ||
              start.trackAnimation==='none'||!start.previewText.includes('DEMO SPEED'))
              throw new Error('Motion animation or demo status is not actually changing');
            const stage=await page.locator('.stage-well').boundingBox();
            const bottom=await page.locator('.mucus-layer--bottom').boundingBox();
            if(!stage||!bottom||bottom.y<stage.y+stage.height)
              throw new Error('Moving mucus intruded into stage camera window');
            await page.emulateMedia({reducedMotion:'reduce'});
            const reduced=await capture();
            console.log('REDUCED_MOTION_CHECK',JSON.stringify(reduced));
            if(reduced.trackAnimation!=='none'||reduced.strandAnimation!=='none')
              throw new Error('Motion not disabled by reduced-motion');
          } finally {await browser.close();}
          JS
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image,ImageChops
          before=Image.open('/tmp/mucus-motion-start.png').convert('RGB')
          after=Image.open('/tmp/mucus-motion-end.png').convert('RGB')
          assert before.size==(1920,1080) and after.size==before.size
          box=(10,585,840,875)
          diff=ImageChops.difference(before.crop(box),after.crop(box))
          moving=sum(1 for px in diff.getdata() if max(px)>18)
          print('VISIBLE_MOTION_CHANGED_PIXELS',moving,flush=True)
          assert moving>120, 'Animation is mathematically active but too subtle in the lower-frame pixels'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mucus-motion-before-after
          path: /tmp/mucus-motion-*.png
          retention-days: 7
