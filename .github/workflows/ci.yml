name: Live Puppet MVP
on:
  push:
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
    paths-ignore: ['docs/**', 'README.md']
permissions:
  contents: read
jobs:
  node:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --ignore-scripts --no-audit --fund=false
      - run: npm test
      - name: Parse both isolated producer-review helpers and asset installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @('scripts/Review-BuffAlert.ps1',
                             'scripts/Review-BuffPreMSI.ps1',
                             'scripts/Install-StankPopupArt.ps1',
                             'scripts/Invoke-BuffSmokeLab.ps1',
                             'scripts/Survey-BuffNativeOBS.ps1',
                             'scripts/Invoke-BuffMicrodirectorGate.ps1',
                             'scripts/Start-BuffMicrodirectorTrial.ps1',
                             'scripts/Invoke-YouTubeChatSmoke.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw "$file : $($parseErrors | Out-String)" }
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline YouTube live-chat reader (no network/API required)
        run: python -m unittest discover -s python -p test_youtube_chat_collector.py -v
      - name: Approved voice catalog selection and intensity tests
        run: python -m unittest discover -s python -p test_live_episode_delivery.py -v
      - name: Offline UI and VAD tests (Windows)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s python -p test_offline.py -v
      - name: Offline UI and VAD tests (Linux virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s python -p test_offline.py -v
