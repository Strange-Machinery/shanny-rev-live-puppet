name: Live Puppet MVP
on:
  push:
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
    paths-ignore: ['docs/**', 'README.md']
permissions:
  contents: read
jobs:
  node:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --ignore-scripts --no-audit --fund=false
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline UI and VAD tests (Windows)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s python -p test_offline.py -v
      - name: Offline UI and VAD tests (Linux virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s python -p test_offline.py -v
