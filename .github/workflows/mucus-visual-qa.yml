name: Temporary mucus frame visual QA
on:
  push:
    branches: [rd/buff-mucus-frame-hud-20261014]
    paths:
      - .github/workflows/mucus-visual-qa.yml
      - src/remote-web/stage.html
      - src/remote-web/stage.css
      - scripts/preview-stank-popup.mjs
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render both real static preview pages in headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          node scripts/preview-stank-popup.mjs > /tmp/stank-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          sleep 2
          for mode in donation hotmic; do
            "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars \
              --window-size=1920,1080 --virtual-time-budget=12500 \
              --screenshot="/tmp/mucus-$mode.png" \
              "http://127.0.0.1:18781/$mode?backdrop=1" \
              >/tmp/chrome-"$mode".log 2>&1
          done
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars \
            --window-size=1920,1080 --virtual-time-budget=3300 \
            --screenshot="/tmp/mucus-donation-early.png" \
            "http://127.0.0.1:18781/donation?backdrop=1" \
            >/tmp/chrome-donation-early.log 2>&1
          mkdir -p artifacts
          cp /tmp/mucus-donation.png /tmp/mucus-hotmic.png /tmp/mucus-donation-early.png artifacts/
      - name: Encode compact visual evidence and check screenshots
        shell: bash
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image,ImageChops
          import base64,io
          for mode in ('donation','hotmic'):
              img=Image.open('artifacts/mucus-'+mode+'.png').convert('RGB')
              assert img.width >= 1900 and img.height >= 1000,(img.width,img.height)
              clipped=img.crop((0,0,900,880))
              clipped.thumbnail((760,744))
              sink=io.BytesIO()
              clipped.save(sink,format='JPEG',quality=40,optimize=True)
              print('MUCUS_IMAGE_'+mode.upper()+'_BEGIN',flush=True)
              print(base64.b64encode(sink.getvalue()).decode('ascii'),flush=True)
              print('MUCUS_IMAGE_'+mode.upper()+'_END',flush=True)
              print('MUCUS_GEOMETRY '+mode+': 1920x1080 screenshot and upper-left '+str(clipped.size),flush=True)
          early=Image.open('artifacts/mucus-donation-early.png').convert('RGB')
          later=Image.open('artifacts/mucus-donation.png').convert('RGB')
          region=(20,615,830,815)
          diff=ImageChops.difference(early.crop(region),later.crop(region))
          changed=sum(1 for pixel in diff.getdata() if max(pixel)>15)
          print('MUCUS_MOTION_CHANGED_PIXELS',changed,flush=True)
          PY
      - name: Verify real-time browser mucus motion and reduced-motion
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --no-audit --fund=false playwright-core@1.56.0
          export CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable)"
          node scripts/preview-stank-popup.mjs > /tmp/stank-realtime.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          sleep 1
          node --input-type=module <<'JS'
          import {chromium} from 'playwright-core';
          const browser=await chromium.launch({
            executablePath:process.env.CHROME_PATH,headless:true,
            args:['--no-sandbox','--disable-dev-shm-usage']
          });
          try{
            const page=await browser.newPage({viewport:{width:1920,height:1080},
              reducedMotion:'no-preference'});
            await page.goto('http://127.0.0.1:18781/donation?backdrop=1');
            const selector='.mucus-strand--a';
            const measure=()=>page.locator(selector).evaluate(el=>({
              animation:getComputedStyle(el).animationName,
              transform:getComputedStyle(el).transform
            }));
            const before=await measure();
            await page.waitForTimeout(1750);
            const after=await measure();
            console.log('REALTIME_MUCUS_ANIMATION',JSON.stringify({before,after}));
            if(before.animation==='none'||before.transform===after.transform)
              throw new Error('Mucus strand did not visibly animate in real-time Chrome');
            await page.emulateMedia({reducedMotion:'reduce'});
            const disabled=await measure();
            console.log('REDUCED_MOTION_MUCUS',JSON.stringify(disabled));
            if(disabled.animation!=='none')throw new Error('prefers-reduced-motion did not stop mucus animation');
            const geometry=await page.locator('.stage-well').boundingBox();
            const drip=await page.locator('.mucus-layer--bottom').boundingBox();
            console.log('FRAME_GEOMETRY',JSON.stringify({stage:geometry,bottom_art:drip}));
            if(!geometry||!drip||drip.y < geometry.y+geometry.height)
              throw new Error('Bottom mucus art intrudes into showbox');
          }finally{await browser.close();}
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: mucus-frame-preview-png
          path: artifacts/mucus-*.png
          retention-days: 7
